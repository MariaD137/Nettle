name: Backend Deploy

on:
  push:
    branches: [main]
    paths:
      - "backend/**"

permissions:
  id-token: write # required for GitHub OIDC -> AWS
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: production # add required reviewers here in GitHub settings before relying on this
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        working-directory: backend
        env:
          ECR_REPOSITORY_URI: ${{ vars.ECR_REPOSITORY_URI }}
        run: |
          docker build -t "$ECR_REPOSITORY_URI:${{ github.sha }}" -t "$ECR_REPOSITORY_URI:latest" .
          docker push "$ECR_REPOSITORY_URI:${{ github.sha }}"
          docker push "$ECR_REPOSITORY_URI:latest"
          # App Runner has AutoDeploymentsEnabled on this service — pushing
          # :latest is what triggers the actual deployment, no separate
          # start-deployment call needed.
