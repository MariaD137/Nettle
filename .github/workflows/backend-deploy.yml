name: Backend Deploy

on:
  push:
    branches: [main]
    paths:
      - "backend/**"

permissions:
  id-token: write # required for GitHub OIDC -> AWS
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: production # add required reviewers here in GitHub settings before relying on this
    steps:
      - uses: actions/checkout@v4

      # See frontend-deploy.yml's identical step for why this exists: fails
      # fast with a specific message instead of a confusing failure deep
      # into the job (or, worse, a job that silently proceeds with an empty
      # ECR_REPOSITORY_URI and pushes to a nonsense image reference).
      - name: Verify required repository variables are configured
        run: |
          missing=()
          [ -z "${{ vars.AWS_REGION }}" ] && missing+=("AWS_REGION")
          [ -z "${{ vars.AWS_DEPLOY_ROLE_ARN }}" ] && missing+=("AWS_DEPLOY_ROLE_ARN")
          [ -z "${{ vars.ECR_REPOSITORY_URI }}" ] && missing+=("ECR_REPOSITORY_URI")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required repository variable(s): ${missing[*]}"
            echo "Set these under Settings -> Secrets and variables -> Actions -> Variables."
            echo "Values come from this account's CloudFormation stack outputs — see infra/scripts/deploy-cloudshell.sh's"
            echo "'Next steps' output (Nettle-CI's DeployRoleArn, Nettle-Ecr's RepositoryUri)."
            exit 1
          fi

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push immutable image
        working-directory: backend
        env:
          ECR_REPOSITORY_URI: ${{ vars.ECR_REPOSITORY_URI }}
        run: |
          set -euo pipefail
          docker build -t "$ECR_REPOSITORY_URI:${{ github.sha }}" .
          docker push "$ECR_REPOSITORY_URI:${{ github.sha }}"

      - name: Deploy image to App Runner
        env:
          ECR_REPOSITORY_URI: ${{ vars.ECR_REPOSITORY_URI }}
        run: |
          set -euo pipefail

          SERVICE_ARN=$(aws apprunner list-services \
            --query "ServiceSummaryList[?ServiceName=='nettle-api'].ServiceArn | [0]" \
            --output text)
          if [ -z "$SERVICE_ARN" ] || [ "$SERVICE_ARN" = "None" ]; then
            echo "::error::No App Runner service named 'nettle-api' found in this account/region. Deploy Nettle-Api via CDK first."
            exit 1
          fi
          echo "Deploying to $SERVICE_ARN"

          # Read the service's current source configuration and change only
          # the image identifier — preserves the ECR access role, port, and
          # every runtime env var/secret Nettle-Api's CDK stack configured,
          # rather than reconstructing (and risking dropping) that config here.
          CURRENT_CONFIG=$(aws apprunner describe-service \
            --service-arn "$SERVICE_ARN" \
            --query "Service.SourceConfiguration")
          NEW_CONFIG=$(echo "$CURRENT_CONFIG" | jq --arg img "$ECR_REPOSITORY_URI:${{ github.sha }}" \
            '.ImageRepository.ImageIdentifier = $img')

          aws apprunner update-service \
            --service-arn "$SERVICE_ARN" \
            --source-configuration "$NEW_CONFIG"

          # Fails the job (non-zero exit) if the deployment doesn't stabilize.
          aws apprunner wait service-updated-successfully --service-arn "$SERVICE_ARN"
