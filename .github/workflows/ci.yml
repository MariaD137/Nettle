name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  backend-quality:
    name: Backend — Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # backend/src/db is PostgreSQL-only now (no SQLite fallback) — `npm
    # test` needs a real, reachable database (see package.json's `pretest`
    # / test/resetTestDb.ts). GitHub Actions' native `services:` runs this
    # as a sidecar container for the job, reachable at localhost:5432 from
    # the job's own steps — matches NETTLE_TEST_DATABASE_URL's default in
    # test/resetTestDb.ts and test/postgresMigration.test.ts exactly, so no
    # extra env var is needed here.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nettle
          POSTGRES_PASSWORD: nettle_test_password
          POSTGRES_DB: nettle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install Semgrep
        run: pip install semgrep==1.65.0

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies for known vulnerabilities
        # high/critical only — Dependabot (.github/dependabot.yml) already
        # opens PRs for everything else on a weekly cadence; this is the
        # merge-blocking gate for the severities that shouldn't wait a week.
        run: npm audit --audit-level=high

      - name: Lint (typecheck)
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  frontend-quality:
    name: Frontend — Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies for known vulnerabilities
        run: npm audit --audit-level=high

      - name: Lint (typecheck)
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
