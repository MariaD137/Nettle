name: Backend Deploy (Staging)

on:
  push:
    branches: [develop]
    paths:
      - "backend/**"

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4 (pinned SHA; exact patch tag not independently verified)
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - name: Build and push image
        working-directory: backend
        env:
          ECR_REPOSITORY_URI: ${{ vars.ECR_REPOSITORY_URI }}
        run: |
          docker build -t "$ECR_REPOSITORY_URI:${{ github.sha }}" -t "$ECR_REPOSITORY_URI:staging" .
          docker push "$ECR_REPOSITORY_URI:${{ github.sha }}"
          docker push "$ECR_REPOSITORY_URI:staging"
