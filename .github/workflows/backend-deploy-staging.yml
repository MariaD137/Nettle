name: Backend Deploy (Staging)

on:
  push:
    branches: [develop]
    paths:
      - "backend/**"

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7

      - name: Verify required repository variables are configured
        run: |
          missing=()
          [ -z "${{ vars.AWS_REGION }}" ] && missing+=("AWS_REGION")
          [ -z "${{ vars.AWS_DEPLOY_ROLE_ARN }}" ] && missing+=("AWS_DEPLOY_ROLE_ARN")
          [ -z "${{ vars.ECR_REPOSITORY_URI }}" ] && missing+=("ECR_REPOSITORY_URI")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required repository variable(s): ${missing[*]}"
            echo "Set these under Settings -> Secrets and variables -> Actions -> Variables (staging Environment)."
            exit 1
          fi

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        working-directory: backend
        env:
          ECR_REPOSITORY_URI: ${{ vars.ECR_REPOSITORY_URI }}
        run: |
          docker build -t "$ECR_REPOSITORY_URI:${{ github.sha }}" -t "$ECR_REPOSITORY_URI:staging" .
          docker push "$ECR_REPOSITORY_URI:${{ github.sha }}"
          docker push "$ECR_REPOSITORY_URI:staging"
