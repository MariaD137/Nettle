name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
  push:
    branches: [main, develop]
    paths:
      - "backend/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Semgrep is what the scanner shells out to for real static analysis
      # (src/scanner/semgrepScanner.ts) — tests exercise it for real, not mocked.
      - run: pip install semgrep
      - run: npm ci
      - run: npm run lint
      - run: npm test
