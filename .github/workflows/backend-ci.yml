# NOTE: this workflow's steps (checkout, setup-node, setup-python, install
# Semgrep, npm ci, lint, test) are a strict subset of ci.yml's
# backend-quality job, which also runs a build and a dependency audit —
# every PR touching backend/** currently runs both, duplicating lint+test.
# Not consolidated in this pass: if this workflow's check name
# ("Backend CI / test") is referenced by a GitHub branch protection
# required-status-check rule, removing it would need that rule updated
# first, which isn't something a repo-file change alone can verify or do
# safely. A human with repo admin access should confirm that before
# deleting or merging this into ci.yml.
name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
  push:
    branches: [main, develop]
    paths:
      - "backend/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # backend/src/db is PostgreSQL-only now (no SQLite fallback) — see the
    # same services: block and comment in ci.yml's backend-quality job.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nettle
          POSTGRES_PASSWORD: nettle_test_password
          POSTGRES_DB: nettle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      # Semgrep is what the scanner shells out to for real static analysis
      # (src/scanner/semgrepScanner.ts) — tests exercise it for real, not mocked.
      - run: pip install semgrep==1.65.0
      - run: npm ci
      - run: npm run lint
      - run: npm test
