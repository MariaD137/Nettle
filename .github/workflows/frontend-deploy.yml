name: Frontend Deploy

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"

permissions:
  id-token: write # required for GitHub OIDC -> AWS
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production # same GitHub Environment/required-reviewers gate as backend-deploy.yml
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # Fails fast with a specific, actionable message instead of letting a
      # missing repository variable surface as aws-actions/configure-aws-
      # credentials's generic "Input required and not supplied: aws-region"
      # deep into the job — every var below is read by a later step in this
      # workflow, so a job that gets this far but is missing one would
      # otherwise fail confusingly (or, for API_BASE_URL, "succeed" while
      # silently baking a broken API URL into the deployed bundle).
      - name: Verify required repository variables are configured
        run: |
          missing=()
          [ -z "${{ vars.AWS_REGION }}" ] && missing+=("AWS_REGION")
          [ -z "${{ vars.AWS_DEPLOY_ROLE_ARN }}" ] && missing+=("AWS_DEPLOY_ROLE_ARN")
          [ -z "${{ vars.FRONTEND_BUCKET_NAME }}" ] && missing+=("FRONTEND_BUCKET_NAME")
          [ -z "${{ vars.FRONTEND_DISTRIBUTION_ID }}" ] && missing+=("FRONTEND_DISTRIBUTION_ID")
          [ -z "${{ vars.API_BASE_URL }}" ] && missing+=("API_BASE_URL")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required repository variable(s): ${missing[*]}"
            echo "Set these under Settings -> Secrets and variables -> Actions -> Variables."
            echo "Values come from this account's CloudFormation stack outputs — see infra/scripts/deploy-cloudshell.sh's"
            echo "'Next steps' output (Nettle-CI's DeployRoleArn, Nettle-Frontend's BucketName/DistributionId, Nettle-Api's ServiceUrl)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        # VITE_API_BASE_URL is baked into the static JS bundle at build time
        # (Vite inlines import.meta.env.* — there is no runtime env var to
        # change later), so it must point at the real API before this step,
        # not be discovered afterward.
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: npm run build

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync hashed assets (long cache — filenames change on every build)
        run: |
          aws s3 sync dist s3://${{ vars.FRONTEND_BUCKET_NAME }} \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html"

      - name: Sync index.html (no cache — this is what a route change/deploy actually updates)
        run: |
          aws s3 cp dist/index.html s3://${{ vars.FRONTEND_BUCKET_NAME }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront (index.html and root only — hashed assets never need it)
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.FRONTEND_DISTRIBUTION_ID }} \
            --paths "/index.html" "/"
