name: Frontend Deploy

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"

permissions:
  id-token: write # required for GitHub OIDC -> AWS
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production # add required reviewers here in GitHub settings before relying on this
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        # VITE_API_BASE_URL has no localhost fallback in production builds
        # (see frontend/src/api.ts) — this variable must be set as a
        # repository/environment variable in GitHub for this step to
        # produce a working build. See AWS_GITHUB_DEPLOYMENT.md.
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync build output to S3
        env:
          FRONTEND_BUCKET: ${{ vars.FRONTEND_BUCKET_NAME }}
        run: |
          aws s3 sync dist/ "s3://$FRONTEND_BUCKET" --delete

      - name: Invalidate CloudFront cache
        env:
          DISTRIBUTION_ID: ${{ vars.FRONTEND_DISTRIBUTION_ID }}
        run: |
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"
