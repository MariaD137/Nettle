version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "npm"
    directory: "/cli"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "npm"
    directory: "/infra"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # backend/Dockerfile's base image (node:22-slim) and any other FROM
  # images — previously not monitored at all, so a base-image CVE would
  # only ever be caught by whatever separately scans the built image, not
  # by Dependabot.
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
